<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RainyDays | My Profile</title>
	<meta name="description" content="A user profile page where you can edit your information and view your order history."/>
	<link rel="stylesheet" href="css/main.css">
	<link
		href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Lato:wght@400;700&display=swap"
		rel="stylesheet">
	<script src="https://kit.fontawesome.com/a87332500a.js" crossorigin="anonymous"></script>
</head>

<body>
	<div id="header"></div>

	<main class="profile-container">

	<h1>Your Profile</h1>

	<section class="profile-card">
		<h2>Account Details</h2>

		<div class="profile-info">
		<p><strong>Name:</strong> <span id="profile-name">Guest User</span></p>
		<p><strong>Email:</strong> <span id="profile-email">guest@example.com</span></p>
		</div>

		<button id="logout-btn" class="logout-btn">Log Out</button>
	</section>

	<section class="profile-card">
		<h2>Order History</h2>
		<div id="order-history"></div>
	</section>

	<section class="profile-card">
		<h2>Saved Favorites</h2>
		<div id="favorite-items"></div>
	</section>

	</main>

	<div id="footer"></div>

	<script src="js/profile.js"></script>

</body>

</html>
