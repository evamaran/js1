<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RainyDays | Outdoor Jackets & Rainwear</title>
	<meta name="description" content="Discover RainyDays' collection of outdoor jackets and rainwear for men and women. Stay dry and stylish with our high-performance gear."/>
	<link rel="stylesheet" href="css/main.css">
	<link
		href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Lato:wght@400;700&display=swap"
		rel="stylesheet">
	<script src="https://kit.fontawesome.com/a87332500a.js" crossorigin="anonymous"></script>
</head>

<body>
	<div id="header"></div>
	<main class="cart-container">
		<h1>Shopping Cart</h1>
		<div class="cart-item">
			<img src="PATH_TO_IMAGE" alt="Product image">

			<div class="cart-info">
				<h3>Rainy Days Thunderbolt Jacket</h3>
				<p>Size: S</p>
				<p>Price: 139.99 NOK</p>
			</div>
			<div class="cart-actions">
			<select>
				<option value="1">1</option>
				<option value="2">2</option>
			</select>
			<button class="remove-btn">Remove</button>
			</div>
		</div>

		<div class="cart-summary">
			<p>Total: 139.99 NOK</p>
			<a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
		</div>
	</main>


<script src="js/components.js"></script>
<script type="module" src="js/cart-page.js"></script>

</body>

</html>
